# Builds the RallyFlow installers and attaches them to a draft GitHub Release.
#   - Push a tag like v1.0.0 (git tag v1.0.0 && git push origin v1.0.0), or run it by hand from the
#     Actions tab (workflow_dispatch: installers are uploaded as workflow artifacts, no release).
#   - Unsigned by default (docs/DECISIONS.md D13). Optional signing/notarization: see docs/RELEASING.md.
#   - electron-builder never publishes by itself (--publish never, and electron-builder.yml has
#     `publish: null`); the release job below attaches the files with GITHUB_TOKEN.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple silicon
            os: macos-latest
            args: --mac dmg zip --arm64
          # Intel Macs. GitHub retired the macos-13 image; macos-15-intel is its Intel successor.
          - name: macOS Intel
            os: macos-15-intel
            args: --mac dmg zip --x64
          - name: Windows
            os: windows-latest
            args: --win nsis --x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run -s typecheck
      - name: Unit and integration tests
        run: npx vitest run
      - name: Third-party notices
        run: npm run -s notices
      - name: Build app
        run: npm run -s build
      - name: Package installers
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # Unsigned unless the optional secrets below are configured (docs/RELEASING.md).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # --- Optional macOS signing + notarization: remove `identity: null` from electron-builder.yml,
          #     delete the CSC_IDENTITY_AUTO_DISCOVERY line above, uncomment these and add the secrets ---
          # CSC_LINK: ${{ secrets.MAC_CERTS_P12_BASE64 }}
          # CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # --- Optional Windows signing with a .pfx certificate ---
          # WIN_CSC_LINK: ${{ secrets.WIN_CERT_PFX_BASE64 }}
          # WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe

  release:
    name: Draft GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: installers-*
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: RallyFlow ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
